# SwiftLint configuration for SpikotWM.

included:
  - Sources

# Multiline collection literals carry a trailing comma throughout this codebase,
# which is also what `swiftlint --fix` and swift-format produce.
trailing_comma:
  mandatory_comma: true

# Coordinate and identifier names that are clearer short than padded out. `x` and `y`
# are also the JSON keys `list --format json` emits, so renaming the properties would
# mean adding CodingKeys for no gain.
identifier_name:
  excluded:
    - x
    - y
    - id
    - ok

# The outstanding cleanups are tracked in suggestions.md; re-reporting every TODO
# on each run only adds noise.
disabled_rules:
  - todo
